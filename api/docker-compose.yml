services:
  db:
    image: postgres:16-alpine
    container_name: usinometria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: usinometria
      POSTGRES_USER: usinometria_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - usinometria_db_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: usinometria-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/usinometria
      DB_USER: usinometria_app
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  usinometria_db_data: